<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FishFinder{% endblock %}</title>
    <!-- ArcGIS CSS -->
    <link rel="stylesheet" href="https://js.arcgis.com/4.26/esri/themes/light/main.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <!-- Navbar -->
    <div class="navbar">
        <div class="brand"><a href="/">FishFinder</a></div>
        <div class="search-bar">
            <input type="text" placeholder="Search for locations..." id="search-input">
            <button id="search-button">Search</button>
        </div>
        <div class="links">
            <a href="/map" id="map-link">Map</a>
        </div>
        <div class="links dropdown">
            <a href="/about-us" id="about-link">About ▼</a>
            <div class="dropdown-menu">
                <a href="/about-us">About Us</a>
                <a href="/services">Services</a>
                <a href="/team">Team</a>
                <a href="/contact-us">Contact Us</a>
            </div>
        </div>
        
        <div class="links">
            <a href="#" id="login-link">Login</a>
        </div>
    </div>
    
    <div class="main-content">
        {% block main_content %} {% endblock %}
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <span class="close" id="login-close">&times;</span>
            <h2>Login to FishFinder</h2>
            <input type="text" placeholder="Username">
            <input type="password" placeholder="Password">
            <button class="btn">Login</button>
        </div>
    </div>
    <script src="static/main.js"></script>
</body>
</html>
